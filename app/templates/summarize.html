<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verdict - Summarise Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <style>
        body { font-family: "Inter", sans-serif; }
        .nav-link.active { color: white; border-bottom-color: #3b82f6; }
        .nav-link { border-bottom: 2px solid transparent; }
        .drag-over { border-color: #3b82f6; background-color: rgba(59, 130, 246, 0.1); }
        textarea { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent; }
    </style>
</head>
<body class="flex h-full flex-col bg-gradient-to-br from-gray-950 via-gray-900 to-gray-800 text-gray-100">

    <!-- HEADER -->
    <header class="bg-gray-900/50 backdrop-blur-xl shadow-2xl border-b border-gray-800 w-full z-10 shrink-0">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
             <a href="{{ url_for('main.home') }}" class="flex items-center gap-4">
                <span class="text-3xl drop-shadow-lg">⚖️</span>
                <h1 class="text-3xl font-semibold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent drop-shadow-md">Verdict</h1>
            </a>
            <a href="https://github.com/yourusername" target="_blank" class="flex items-center gap-2 text-blue-400 hover:text-blue-300">
                <!-- GitHub SVG -->
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24" 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                <span class="hidden sm:inline">GitHub</span>
            </a>
        </div>
    </header>

    <!-- SUB-HEADER NAVIGATION -->
    <div class="bg-gray-900/30 border-b border-gray-800">
        <div class="max-w-4xl mx-auto flex items-center space-x-4 p-2">
            <a href="{{ url_for('main.chat') }}" class="nav-link px-3 py-2 rounded-lg text-sm font-medium text-gray-400 hover:bg-gray-800/50 hover:text-white transition-colors duration-200">Chat</a>
            <a href="{{ url_for('main.summarize_endpoint') }}" class="nav-link px-3 py-2 rounded-lg text-sm font-medium transition-colors duration-200 active">Summarise</a>
        </div>
    </div>

    <!-- MAIN SUMMARISE CONTENT -->
    <main class="flex-1 overflow-y-auto p-4 md:p-6">
        <div class="max-w-4xl mx-auto">
            <h2 class="text-2xl font-semibold mb-4 text-gray-200">Summarise a Document</h2>
            <form id="summarise-form">
                <div id="drop-zone" class="flex flex-col items-center justify-center p-8 border-2 border-dashed border-gray-600 rounded-xl bg-gray-800/50 text-center transition-colors duration-300">
                    <svg class="w-12 h-12 text-gray-500 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-4-4V6a4 4 0 014-4h10a4 4 0 014 4v6a4 4 0 01-4 4H7z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 16v-4m0 0l-2 2m2-2l2 2"></path></svg>
                    <p class="text-lg font-medium text-gray-300">Drag & drop your document here</p>
                    <p class="text-gray-500 mt-1">or</p>
                    <button type="button" id="file-select-btn" class="mt-4 px-4 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-500 transition-colors">Browse Files</button>
                    <input type="file" id="file-input" class="hidden" accept=".pdf" />
                </div>
                <textarea id="document-text" rows="10" class="mt-4 w-full p-4 bg-gray-900/80 border border-gray-700 rounded-lg shadow-inner resize-y" placeholder="Document content will appear here..." required></textarea>
                <div class="mt-4 flex justify-end">
                    <button id="summarise-btn" type="submit" class="px-8 py-3 bg-gradient-to-r from-purple-600 to-blue-600 text-white rounded-xl font-medium hover:shadow-xl transition-all disabled:opacity-50" disabled>Generate Summary</button>
                </div>
            </form>
            <div class="mt-8">
                <div id="loading-indicator-summary" class="hidden text-center text-gray-400 py-4">Verdict is summarising...</div>
                <div id="summary-output" class="hidden prose prose-invert max-w-none bg-gray-800/50 p-6 rounded-xl border border-gray-700"></div>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
