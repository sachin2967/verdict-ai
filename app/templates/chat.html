<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verdict - Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <style>
        body { font-family: "Inter", sans-serif; }
        .nav-link.active { color: white; border-bottom-color: #3b82f6; }
        .nav-link { border-bottom: 2px solid transparent; }
        textarea { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent; }
    </style>
</head>
<body class="flex h-full flex-col bg-gradient-to-br from-gray-950 via-gray-900 to-gray-800 text-gray-100">

    <!-- HEADER -->
    <header class="bg-gray-900/50 backdrop-blur-xl shadow-2xl border-b border-gray-800 w-full z-10 shrink-0">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="{{ url_for('main.home') }}" class="flex items-center gap-4">
                <span class="text-3xl drop-shadow-lg">⚖️</span>
                <h1 class="text-3xl font-semibold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent drop-shadow-md">Verdict</h1>
            </a>
            <a href="https://github.com/yourusername" target="_blank" class="flex items-center gap-2 text-blue-400 hover:text-blue-300">
                <!-- GitHub SVG -->
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                <span class="hidden sm:inline">GitHub</span>
            </a>
        </div>
    </header>

    <!-- SUB-HEADER NAVIGATION -->
    <div class="bg-gray-900/30 border-b border-gray-800">
        <div class="max-w-4xl mx-auto flex items-center space-x-4 p-2">
            <a href="{{ url_for('main.chat') }}" class="nav-link px-3 py-2 rounded-lg text-sm font-medium transition-colors duration-200 active">Chat</a>
            <a href="{{ url_for('main.summarize_endpoint') }}" class="nav-link px-3 py-2 rounded-lg text-sm font-medium text-gray-400 hover:bg-gray-800/50 hover:text-white transition-colors duration-200">Summarise</a>
        </div>
    </div>

    <!-- MAIN CHAT CONTENT -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6">
        <div id="message-list" class="max-w-4xl mx-auto space-y-8">
            <div class="message-wrapper"><div class="message-ai"><div class="message-content"><p>Hello! I am Verdict. Ask me any question about your legal documents.</p></div></div></div>
        </div>
    </main>

    <!-- FOOTER FORM -->
    <footer class="bg-gray-900/50 backdrop-blur-xl border-t border-gray-800 w-full z-10 shrink-0 p-4">
        <div class="max-w-4xl mx-auto">
            <div id="loading-indicator-chat" class="hidden text-center text-sm text-gray-400 mb-2">Verdict is thinking...</div>
            <form id="chat-form" class="flex items-center space-x-3">
                <textarea id="question" name="question" rows="1" class="flex-1 p-4 bg-gray-800/70 border border-gray-700 rounded-xl shadow-lg focus:ring-2 focus:ring-blue-500/50 focus:outline-none resize-none" placeholder="Ask a question..."></textarea>
                <button id="ask-btn" type="submit" class="px-6 py-3.5 bg-gradient-to-r from-blue-600 to-blue-500 text-white rounded-xl font-medium hover:shadow-xl transition-all disabled:opacity-50">Send</button>
            </form>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
